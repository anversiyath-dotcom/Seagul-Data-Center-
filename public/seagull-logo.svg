<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <!-- Sky Arc & Horizontal Bars Gradient (Light Cyan to Royal Blue) -->
    <linearGradient id="sgSkyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#29B6F6" />
      <stop offset="50%" stop-color="#0288D1" />
      <stop offset="100%" stop-color="#1565C0" />
    </linearGradient>

    <!-- Blue Bird Gradient (Cyan on Head/Wing to Deep Blue on Upper Wing) -->
    <linearGradient id="sgBirdGrad" x1="0%" y1="50%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B0FF" />
      <stop offset="45%" stop-color="#0288D1" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>

    <!-- Gold Wing / Airplane Shape Gradient (Warm Metallic Desert Gold) -->
    <linearGradient id="sgGoldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4A75E" />
      <stop offset="50%" stop-color="#C59B4E" />
      <stop offset="100%" stop-color="#B88A3B" />
    </linearGradient>

    <!-- SEAGULL GLOBAL Text Gradient (Cyan to Royal Blue) -->
    <linearGradient id="sgTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A8FF" />
      <stop offset="35%" stop-color="#0284C7" />
      <stop offset="70%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>

  <g transform="translate(0, 10)">
    <!-- 1. Top Sky Semi-Circle Arch -->
    <path d="M 236,150 C 236,92 284,45 344,45 C 404,45 452,92 452,150" 
          fill="none" 
          stroke="url(#sgSkyGrad)" 
          stroke-width="16" 
          stroke-linecap="round" />

    <!-- 2. Left Horizontal Horizon Bar into Wing Swoop -->
    <path d="M 160,150 L 220,150 C 240,150 270,175 300,205" 
          fill="none"
          stroke="url(#sgSkyGrad)" 
          stroke-width="13" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- 3. Right Horizontal Horizon Bar -->
    <path d="M 436,150 L 496,150" 
          fill="none"
          stroke="url(#sgSkyGrad)" 
          stroke-width="13" 
          stroke-linecap="round" />

    <!-- 4. Gold Airplane / Lower Wing Shape -->
    <!-- Curves under bird belly, sweeps up to right wing tip, and features vertical tail -->
    <path d="M 248,228 
             C 275,268 355,274 410,230 
             C 440,205 480,180 495,178 
             C 502,177 500,188 490,196 
             C 462,220 425,250 405,268 
             L 405,310 
             C 405,318 416,318 418,310 
             L 418,252 
             C 432,238 480,195 498,172 
             C 475,190 435,215 398,222 
             C 345,232 300,210 286,190 
             C 280,182 270,182 268,188 
             C 260,208 248,220 248,228 Z" 
          fill="url(#sgGoldGrad)" />

    <!-- 5. Blue Seagull Bird in Flight -->
    <!-- Head with beak pointing left, arched body, wings stretching right & left -->
    <path d="M 210,215 
             C 205,215 200,218 195,221 
             C 200,223 206,223 214,220 
             C 230,224 250,235 295,235 
             C 340,235 385,200 445,150 
             C 385,175 330,215 295,215 
             C 265,215 242,195 210,215 Z" 
          fill="url(#sgBirdGrad)" />

    <!-- Upper Wing of Seagull reaching up and right -->
    <path d="M 275,195 
             C 305,170 370,130 445,150 
             C 390,172 340,215 295,215 
             C 285,215 278,205 275,195 Z" 
          fill="url(#sgBirdGrad)" />

    <!-- 6. Brand Name Typography: SEAGULL GLOBAL (Cyan to Royal Blue Gradient) -->
    <text x="330" y="345" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-weight="900" 
          font-size="48" 
          letter-spacing="3" 
          fill="url(#sgTextGrad)">SEAGULL GLOBAL</text>

    <!-- 7. Tagline Typography: YOUR GATEWAY TO THE WORLD -->
    <text x="330" y="382" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-weight="500" 
          font-size="18.5" 
          letter-spacing="5" 
          fill="#1E293B">YOUR GATEWAY TO THE WORLD</text>
  </g>
</svg>
