<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="100%" height="100%">
  <defs>
    <!-- Sky Arc Gradient (Cyan to Royal Blue) -->
    <linearGradient id="sgSkyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#29B6F6" />
      <stop offset="50%" stop-color="#0288D1" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Blue Bird Gradient (Cyan on Beak/Left Wing to Cobalt Royal Blue on Right Wing) -->
    <linearGradient id="sgBirdGrad" x1="0%" y1="30%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B0FF" />
      <stop offset="35%" stop-color="#008CE3" />
      <stop offset="70%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Gold Airplane & Lower Arc Gradient (Warm Metallic Sand Gold) -->
    <linearGradient id="sgGoldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5BF7D" />
      <stop offset="50%" stop-color="#CAA05D" />
      <stop offset="100%" stop-color="#B88D44" />
    </linearGradient>

    <!-- SEAGULL GLOBAL Text Gradient -->
    <linearGradient id="sgTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ADEF" />
      <stop offset="25%" stop-color="#0096E6" />
      <stop offset="65%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>

  <g id="brand-emblem">
    <!-- 1. Top Sky Semi-Circle Arch -->
    <path d="M 385,205 A 120,120 0 0,1 615,205" 
          fill="none" 
          stroke="url(#sgSkyGrad)" 
          stroke-width="26" 
          stroke-linecap="round" />

    <!-- 2. Blue Seagull Bird in Dynamic Flight with Symmetrical Horizon Wings -->
    <path d="M 270,205 
             L 355,205 
             C 385,205 415,245 445,280 
             C 495,245 555,205 615,205 
             L 730,205 
             C 736,205 740,210 740,215 
             C 740,220 736,225 730,225 
             L 615,225 
             C 565,255 515,300 475,325 
             C 425,325 390,312 375,296 
             L 358,292 
             L 372,289 
             C 405,278 355,225 270,225 
             C 264,225 260,220 260,215 
             C 260,210 264,205 270,205 Z" 
          fill="url(#sgBirdGrad)" />

    <!-- 3. Gold Airplane & Lower Globe Arc -->
    <path d="M 395,290 
             C 430,345 470,365 510,365 
             C 545,365 585,348 615,315 
             L 615,385 
             C 615,392 632,392 632,385 
             L 632,322 
             C 660,295 705,255 740,222 
             C 748,214 754,224 746,232 
             C 705,275 665,312 638,320 
             C 615,295 580,268 565,266 
             C 558,266 558,274 565,278 
             C 585,295 605,308 610,318 
             C 580,342 545,348 510,348 
             C 465,348 430,328 405,295 
             Z" 
          fill="url(#sgGoldGrad)" />
  </g>

  <!-- 4. SEAGULL GLOBAL Brand Title -->
  <text x="500" y="535" 
        text-anchor="middle" 
        font-family="Montserrat, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="900" 
        font-size="72" 
        letter-spacing="2.5" 
        fill="url(#sgTextGrad)">SEAGULL GLOBAL</text>

  <!-- 5. Tagline: YOUR GATEWAY TO THE WORLD -->
  <text x="500" y="590" 
        text-anchor="middle" 
        font-family="Montserrat, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="500" 
        font-size="23" 
        letter-spacing="9.5" 
        fill="#231F20">YOUR GATEWAY TO THE WORLD</text>
</svg>
